<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — MediNova Clinic Patient Portal</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

    <!--
      DASHBOARD — a redirect, not a screen.

      The nav row, the <title> and the <h1> all say "Dashboard"; the file is
      still home.html. That split is deliberate — renaming the file would
      break every existing link, bookmark, deep link and test address for a
      word — but it leaves one gap: somebody who reads "Dashboard" and types
      the matching address. This page closes it.

      There is nothing to keep in sync here. It holds no markup of its own, so
      the screen can change freely without this file ever being touched again.

      Classic script, not a module and not a <meta refresh>, for the same
      reason index.html gives: modules do not run from file://, and a meta
      refresh would fire on a disk-opened copy too and bounce it to a page
      that cannot start. Guarding on the protocol lets the file:// warning do
      its job instead.
    -->
    <!-- The one typeface the product is set in. These pages carry visible text
         of their own — the file:// warning — so they load it like a screen. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />

    <script src="js/open-me-properly.js"></script>
    <script>
      if (location.protocol === 'http:' || location.protocol === 'https:') {
        // replace(), not assign(): Back from the dashboard should return to
        // wherever you came from, not to this address, which would bounce you
        // straight forward again and trap you.
        location.replace('home.html' + location.search + location.hash);
      }
    </script>
  </head>

  <body>
    <!-- Only ever seen on file://, behind the warning open-me-properly.js puts
         up, and for the instant before the redirect over http. -->
    <noscript>
      <p>
        This prototype needs JavaScript. Open
        <a href="home.html">the dashboard</a> directly.
      </p>
    </noscript>
  </body>
</html>
