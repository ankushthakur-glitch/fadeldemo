<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot password — MediNova Clinic Patient Portal</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/screen-auth.css" />
    <link rel="stylesheet" href="css/select-menu.css" />

    <!--
      NOT IN THE SUPPLIED DESIGN.

      The login screen has a "Forgot Password" link, so this page exists to
      catch it — a dead link on the one screen every patient sees is worse
      than a page built to the same auth layout and flagged as unspecified.
      It reuses screen-auth.css wholesale and invents no new patterns.
    -->
    <script type="module" src="js/screens/forgot-password.js"></script>
    <script type="module" src="js/lib/select-menu.js"></script>
    <script type="module" src="js/comments.js"></script>
    <script src="js/open-me-properly.js"></script>
  </head>

  <body class="pp-auth">
    <div class="pp-auth__grid">
      <section class="pp-auth__side">
        <a class="pp-auth__brand" href="login.html">
          <img src="assets/medinova-logo.svg" alt="MediNova Clinic" width="335" height="68" />
        </a>

        <main class="pp-auth__main">
          <div class="pp-auth__card">
            <h1 class="pp-auth__title">Forgot password</h1>
            <p class="pp-auth__subtitle">
              Enter the email address on your account and we will send a link to
              reset your password.
            </p>

            <div class="pp-auth__error" id="authError" hidden></div>

            <form class="pp-auth__form" id="resetForm" novalidate>
              <div class="pp-field">
                <label class="pp-label" for="email">Email</label>
                <div class="pp-control pp-control--icon">
                  <input
                    class="pp-input"
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="username"
                    placeholder="Enter Email"
                    data-testid="forgot--email"
                  />
                  <span class="pp-control__icon">
                    <svg class="pp-icon" aria-hidden="true"><use href="#pi-mail"></use></svg>
                  </span>
                </div>
                <p class="pp-field__error" id="emailError" hidden></p>
              </div>

              <button
                type="submit"
                class="pp-btn pp-btn--primary pp-btn--full"
                data-testid="forgot--submit"
              >
                Send reset link
              </button>

              <a class="pp-btn pp-btn--quiet pp-btn--full" href="login.html">
                <svg class="pp-icon pp-icon--sm" aria-hidden="true">
                  <use href="#pi-arrow-left"></use>
                </svg>
                <span>Back to log in</span>
              </a>
            </form>
          </div>
        </main>
      </section>

      <aside class="pp-auth__promo" aria-hidden="true">
        <div class="pp-auth__slide" data-current="true"></div>
        <div class="pp-auth__scrim"></div>
        <div class="pp-auth__caption">
          <h2>Your Health, One Place.</h2>
          <p>
            Appointments, medications, results and messages from your care team,
            together in a single secure portal.
          </p>
        </div>
      </aside>
    </div>
  </body>
</html>
