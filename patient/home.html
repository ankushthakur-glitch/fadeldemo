<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — MediNova Clinic Patient Portal</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/screen-home.css" />
    <link rel="stylesheet" href="css/select-menu.css" />

    <!-- guard.js FIRST and classic, so a signed-out visitor is redirected
         before anything on this page paints. See js/guard.js. -->
    <script src="js/guard.js"></script>
    <script type="module" src="js/screens/home.js"></script>
    <script type="module" src="js/lib/select-menu.js"></script>
    <script type="module" src="js/comments.js"></script>
    <script src="js/open-me-properly.js"></script>
  </head>

  <body class="pp-app">
    <header class="pp-topbar" id="topbar"></header>

    <div class="pp-body">
      <nav class="pp-side pp-scroll" id="sidenav" aria-label="Portal sections"></nav>

      <main class="pp-main">
        <div class="pp-content pp-scroll">
          <!-- Named Dashboard, at home.html. The screen says what it is; the
               address stays what every existing link, bookmark and test
               already points at. dashboard.html redirects here for anyone who
               types the name they can see.

               No <h1> here any more: the screen's heading is the greeting the
               first band draws — "Welcome back, Henna" — and it needs the
               signed-in patient's name, which only the script has. A visually
               hidden "Dashboard" above a visible greeting would give the page
               two headings saying different things. -->
          <div class="pp-home" id="dashboard"></div>
        </div>
      </main>
    </div>
  </body>
</html>
