    <!--
      NOTIFICATIONS — the whole list, where the bell's panel shows the top few.

      ⚠ NOT IN THE SUPPLIED DESIGN. The bell is drawn with an unread count and
      nothing behind it; the panel is where that count leads, and this page is
      where the panel's "View all notifications" leads. It exists because a
      dropdown is the wrong container for a history: it is short, it closes on
      any outside click, and it cannot be linked to.

      It is NOT in the side nav, deliberately. The bell is the way in — a
      notification list is something you check when the bell says there is
      something, not a section of the portal you browse. A nav row for it would
      compete with the eight rows that are places rather than events.
    -->
    <script src="js/guard.js"></script>
    <script type="module" src="js/screens/notifications.js"></script>
    <script type="module" src="js/lib/select-menu.js"></script>
    <script src="js/open-me-properly.js"></script>
