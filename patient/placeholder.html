    <!--
      THE HONEST DEAD END.

      One section is named in the navigation but never drawn: Notification
      Setting. There were three ways to handle that and this is the least bad
      one.

      Emails and Education Material were the others, until each was dropped
      from the nav altogether — a placeholder is for a section that is still
      on the menu, not for one that is gone. This page still answers their
      old ?section= addresses; it just highlights nothing in the nav.

        - Leave the links pointing nowhere: reads as a broken build, and a
          reviewer spends their attention filing a bug that is not one.
        - Disable them: removes them from the navigation, which is part of
          what is under review.
        - Invent the screens: puts design decisions nobody made in front of
          people who will assume somebody made them.

      So the link works, the shell is intact, the section is highlighted in
      the nav where it should be, and the page says exactly why there is
      nothing here.
    -->
    <script src="js/guard.js"></script>
    <script type="module" src="js/screens/placeholder.js"></script>
    <script type="module" src="js/lib/select-menu.js"></script>
    <script src="js/open-me-properly.js"></script>
  </head>

        </div>
      </main>
    </div>
