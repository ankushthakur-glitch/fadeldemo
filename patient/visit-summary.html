<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visit Summary — MediNova Clinic Patient Portal</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/screen-visit-summary.css" />
    <link rel="stylesheet" href="css/select-menu.css" />

    <!--
      Where "View Visit Summary" on a past appointment lands:

          visit-summary.html?appointment=appt-aug-08

      A page rather than a dialog. This is a document a patient reads slowly,
      shows to a family member, prints for a specialist and comes back to a
      month later — all of which want an address, a Back button and a print
      layout. A modal has none of the three.
    -->
    <script src="js/guard.js"></script>
    <script type="module" src="js/screens/visit-summary.js"></script>
    <script type="module" src="js/lib/select-menu.js"></script>
    <script type="module" src="js/comments.js"></script>
    <script src="js/open-me-properly.js"></script>
  </head>

  <body class="pp-app">
    <header class="pp-topbar" id="topbar"></header>

    <div class="pp-body">
      <nav class="pp-side pp-scroll" id="sidenav" aria-label="Portal sections"></nav>

      <main class="pp-main">
        <div class="pp-content pp-scroll">
          <!-- The <h1> is rendered inside, by the screen module: it names the
               visit, and the visit is not known until the query string is
               read. -->
          <div id="screen"></div>
        </div>
      </main>
    </div>
  </body>
</html>
